plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wangqifei.eu.org.starter'
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.wangqifei.eu.org.starter"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 4
        versionName "1.2"
    }

    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
}
